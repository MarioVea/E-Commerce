services:
  backend:
    build: ./backend
    container_name: ecommerce-backend
    ports:
      - "4001:4001"
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
    container_name: ecommerce-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
